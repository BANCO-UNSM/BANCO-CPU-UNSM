<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biología semana 14 · Preguntas CPU</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#f1f7fc;font:15px system-ui,sans-serif;color:#173952}.wrap{max-width:880px;margin:auto;background:white;border:1px solid #c9dfed;border-radius:12px;padding:16px}h2{font-size:19px;margin:0 0 8px}.muted{color:#547087;font-size:13px}.question{font-weight:650;white-space:pre-wrap;line-height:1.55;margin:20px 0}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #bed1df;border-radius:7px;padding:9px 11px;margin:6px 0;cursor:pointer;color:inherit;font:inherit}.option:disabled{cursor:default}.option.good{background:#e6f5ed;border-color:#26865c}.option.bad{background:#fff0f0;border-color:#bf4852}.feedback{margin:15px 0;padding:12px;background:#eef6fb;border-radius:8px;line-height:1.55}.next{background:#087f79;border:0;border-radius:8px;color:white;font-weight:750;padding:11px 17px;cursor:pointer}.progress{font-size:13px;color:#496c84}button:focus-visible{outline:3px solid #1c85d3;outline-offset:2px}</style></head><body><div class="wrap"><h2>Preguntas CPU · Biología · Semana 14</h2><p class="muted">27 preguntas de la separata 2026-III. Selecciona una alternativa para ver la explicación.</p><div id="app"></div></div><script src="biologia-semana14-preguntas.js?v=1"></script><script>(function(){const qs=window.CACHIMBOLAB_BIO14_QUESTIONS||[],root=document.getElementById('app');let i=0,score=0;const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};function draw(){root.replaceChildren();if(i>=qs.length){root.append(el('h3','','Resultado: '+score+' de '+qs.length+' respuestas correctas.'));const b=el('button','next','Volver a practicar');b.onclick=()=>{i=0;score=0;draw()};root.append(b);return}const [q,options,key,explain]=qs[i];root.append(el('p','progress','Pregunta '+(i+1)+' de '+qs.length));root.append(el('div','question',q));const answers=el('div');const feedback=el('div','feedback');feedback.hidden=true;const next=el('button','next',i===qs.length-1?'Ver resultado':'Siguiente pregunta →');next.hidden=true;next.onclick=()=>{i++;draw()};options.forEach((opt,j)=>{const b=el('button','option',String.fromCharCode(97+j)+'. '+opt);b.onclick=()=>{if(!feedback.hidden)return;const ok=j===key;if(ok)score++;[...answers.children].forEach((node,k)=>{node.disabled=true;if(k===key)node.classList.add('good');else if(k===j)node.classList.add('bad')});feedback.textContent=(ok?'¡Correcto! ':'Respuesta correcta: '+String.fromCharCode(97+key)+'. ')+explain;feedback.hidden=false;next.hidden=false};answers.append(b)});root.append(answers,feedback,next)}draw()})();</script></body></html>

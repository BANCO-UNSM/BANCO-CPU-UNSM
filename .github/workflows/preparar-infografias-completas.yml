name: Preparar infografías completas de Beca 18
on:
  push:
    branches: [fix/beca18-infografias-completas-canvas]
    paths: ['.github/workflows/preparar-infografias-completas.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf pillow
      - name: Recortar infografías completas desde páginas ya verificadas
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          # Las fuentes son las páginas originales que ya conserva la plataforma.
          specs=[
            (2024,'radiacion-uv',18,(.105,.12,.91,.89)),
            (2024,'sueno-grafico',24,(.16,.64,.80,.81)),
            (2025,'desinformacion-grafico',15,(.24,.28,.79,.57)),
            (2025,'lesion-cerebral',17,(.10,.28,.87,.86)),
            (2025,'oceanos-plastico',24,(.10,.19,.84,.59))
          ]
          for year,name,page,box in specs:
              source=Path('beca18-images')/str(year)/f'page-{page}.jpg'
              assert source.exists(),source
              with Image.open(source) as image:
                  w,h=image.size
                  coords=(round(w*box[0]),round(h*box[1]),round(w*box[2]),round(h*box[3]))
                  crop=image.crop(coords)
                  assert crop.width>300 and crop.height>120
                  out=Path('beca18-temporary-fixed')/str(year)/(name+'.jpg')
                  out.parent.mkdir(parents=True,exist_ok=True)
                  crop.save(out,quality=89,optimize=True)
                  print(out,coords,crop.size,out.stat().st_size)
          PY
      - name: Guardar imágenes solo para transferencia al banco privado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beca18-temporary-fixed
          if ! git diff --cached --quiet; then
            git commit -m 'assets(beca18): staging temporal de infografías completas'
            git fetch origin fix/beca18-infografias-completas-canvas
            git rebase origin/fix/beca18-infografias-completas-canvas
            git push origin HEAD:fix/beca18-infografias-completas-canvas
          fi
